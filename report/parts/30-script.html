  var lw=0;cfg.x.forEach(function(s){lw=Math.max(lw,String(s).length*6.7+16)});
  var every=Math.max(1,Math.ceil(lw/step));if(/^\d{4}$/.test(cfg.x[0])){var nice=[1,2,3,4,5,10];for(var q=0;q<nice.length;q++){if(nice[q]>=every){every=nice[q];break}}}
  cfg.x.forEach(function(lab,i){if((n-1-i)%every!==0)return;var a='middle',hw=String(lab).length*3.5+2;if(i===n-1&&m.r<hw)a='end';if(i===0&&m.l<hw)a='start';S('text',{x:X(i),y:m.t+ph+19,'text-anchor':a,'class':'tick'},svg,lab)});
  var ends=[];
  cfg.series.forEach(function(s){
    var d='',pen=false,last=null,first=null;
    s.values.forEach(function(v,i){if(v==null){if(!(cfg.connect||s.connect))pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Yv(v).toFixed(1);pen=!(cfg.breaks&&cfg.breaks.indexOf(cfg.x[i])>=0);last=i;if(first==null)first=i});
    var p=S('path',{d:d,'class':'ln',pathLength:1},svg);p.style.stroke='var('+s.c+')';
    if(cfg.points||s.points)s.values.forEach(function(v,i){if(v==null||i===last)return;var c=S('circle',{cx:X(i),cy:Yv(v),r:3.5,'class':'pt'},svg);c.style.fill='var('+s.c+')'});
    if(last!=null){var c=S('circle',{cx:X(last),cy:Yv(s.values[last]),r:4.5,'class':'dot'},svg);c.style.fill='var('+s.c+')';ends.push({s:s,i:last,y:Yv(s.values[last]),v:s.values[last],fi:first,fy:Yv(s.values[first])})}
  });
  if(endL){
    var col=ends.filter(function(e){return !e.s.near});
    col.sort(function(a,b){return a.y-b.y});col.forEach(function(e){e.ly=e.y});
    for(var k=1;k<col.length;k++)col[k].ly=Math.max(col[k].ly,col[k-1].ly+15);
    for(k=col.length-1;k>=0;k--){var lim=k===col.length-1?m.t+ph:col[k+1].ly-15;if(col[k].ly>lim)col[k].ly=lim}
    col.forEach(function(e){
      var lx=m.l+pw+12;
      if(Math.abs(e.ly-e.y)>3||e.i<n-1)S('path',{d:'M'+(X(e.i)+6)+' '+e.y+'L'+(lx-3)+' '+e.ly,'class':'lead'},svg);
      var t=S('text',{x:lx,y:e.ly+4,'class':'lab'},svg);S('tspan',{'class':'v'},t,(cfg.tipFmt||cfg.yFmt)(e.v));S('tspan',{dx:5},t,e.s.short||e.s.name);
    });
    ends.filter(function(e){return e.s.near}).forEach(function(e){S('text',{x:X(e.fi)-9,y:e.fy+4,'text-anchor':'end','class':'lab'},svg,e.s.short||e.s.name)});
  }
  (cfg.notes||[]).forEach(function(a){S('text',{x:X(a.i),y:Yv(a.v),'text-anchor':a.anchor||'start','class':'ann'},svg,wide?a.text:(a.short||a.text))});
  var hl=S('line',{y1:m.t,y2:m.t+ph,'class':'xh'},svg);hl.style.display='none';
  var hd=cfg.series.map(function(s){var c=S('circle',{r:4.5,'class':'dot'},svg);c.style.fill='var('+s.c+')';c.style.display='none';return c});
  var ov=S('rect',{x:m.l-step/2,y:m.t,width:pw+step,height:ph,fill:'transparent'},svg);
  function at(ev){
    var r=svg.getBoundingClientRect(),i=Math.round((ev.clientX-r.left-m.l)/step);i=Math.max(0,Math.min(n-1,i));
    hl.setAttribute('x1',X(i));hl.setAttribute('x2',X(i));hl.style.display='';
    var rows=[];
    cfg.series.forEach(function(s,si){var v=s.values[i];if(v==null){hd[si].style.display='none';return}hd[si].setAttribute('cx',X(i));hd[si].setAttribute('cy',Yv(v));hd[si].style.display='';rows.push({c:s.c,name:s.short||s.name,val:(cfg.tipFmt||cfg.yFmt)(v),line:true})});
    showTip(cfg.xTitle+' '+cfg.x[i]+(cfg.bands&&cfg.bands.indexOf(cfg.x[i])>=0?' · RMDs waived':''),rows,ev.clientX,ev.clientY);
  }
  ov.addEventListener('pointermove',at);ov.addEventListener('pointerdown',at);
  ov.addEventListener('pointerleave',function(){hl.style.display='none';hd.forEach(function(c){c.style.display='none'});hideTip()});
}

/* ---------- horizontal stacked / simple bars ---------- */
function renderH(plot,cfg,W,st,M,scale){
  plot.textContent='';
  var data=M||(cfg.modes?cfg.modes[st.mode]:cfg.data),sc=scale==null?1:scale;
  var wide=W>=560,hasSub=cfg.rows.some(function(r){return r.sub}),LW=wide?(cfg.labelW||160):0,bh=22;
  var rowH=wide?(hasSub?46:34):52,top=4,axisH=cfg.simple?4:24,Hh=top+cfg.rows.length*rowH+axisH;
  var x0=LW,bw=W-LW-(cfg.simple?48:8);
  var svg=S('svg',{width:W,height:Hh,viewBox:'0 0 '+W+' '+Hh,role:'img','aria-label':cfg.aria||'Chart'},plot);
  if(!cfg.simple)[0,25,50,75,100].forEach(function(v){var x=x0+bw*v/100;S('line',{x1:x,x2:x,y1:top,y2:Hh-axisH+3,'class':v===0?'axis':'grid'},svg);S('text',{x:x,y:Hh-6,'text-anchor':v===0?'start':(v===100?'end':'middle'),'class':'tick'},svg,v+'%')});
  else S('line',{x1:x0,x2:x0,y1:top,y2:Hh-axisH,'class':'axis'},svg);
  cfg.rows.forEach(function(r,ri){
    var y=top+ri*rowH+(wide?(rowH-bh)/2:rowH-bh-6);
    if(wide){S('text',{x:0,y:y+(r.sub?8:15),'class':'rowl'},svg,r.label);if(r.sub)S('text',{x:0,y:y+23,'class':'rows'},svg,r.sub)}
    else{var t=S('text',{x:0,y:y-7,'class':'rowl'},svg,r.label);if(r.sub)S('tspan',{'class':'rows',dx:8},t,r.sub)}
    var vals=data[ri],tot=cfg.max||vals.reduce(function(a,b){return a+b},0),x=x0;
    vals.forEach(function(v,si){
      var seg=cfg.segs[si],w=bw*v/tot*sc,last=si===vals.length-1,gw=Math.max(0,w-(last?0:2)),g;
      if(last){var rr=Math.min(4,gw/2);g=S('path',{d:'M'+x+' '+y+'H'+(x+gw-rr)+'Q'+(x+gw)+' '+y+' '+(x+gw)+' '+(y+rr)+'V'+(y+bh-rr)+'Q'+(x+gw)+' '+(y+bh)+' '+(x+gw-rr)+' '+(y+bh)+'H'+x+'Z'},svg)}
      else g=S('rect',{x:x,y:y,width:gw,height:bh},svg);
      g.setAttribute('class','hit');g.style.fill='var('+seg.c+')';
      if(cfg.focus){g.setAttribute('tabindex','0');g.setAttribute('role','img');g.setAttribute('aria-label',r.label+(r.sub?', '+r.sub:'')+': '+seg.name+' '+cfg.fmt(v))}
      var txt=pct(0)(v);
      if(!cfg.simple&&gw>=txt.length*6.8+10){var it=S('text',{x:x+gw/2,y:y+bh/2+4,'text-anchor':'middle','class':'in'},svg,txt);it.style.fill='var('+seg.c+'-ink)'}
      if(cfg.simple)S('text',{x:x+gw+7,y:y+bh/2+4,'class':'val'},svg,cfg.fmt(v));
      hover(g,r.label+(r.sub?' · '+r.sub:''),function(){return [{c:seg.c,name:seg.name,val:cfg.fmt(v)}]});
      x+=w;
    });
  });
}

/* ---------- vertical bars with year scrubber ---------- */
function renderV(plot,cfg,W,st,vals,scale){
  plot.textContent='';
  var v=vals||cfg.frames[st.year],sc=scale==null?1:scale,ref=cfg.frames[cfg.ref];
  var wide=W>=600,Hh=wide?330:290,m={t:24,r:8,b:30,l:36},pw=W-m.l-m.r,ph=Hh-m.t-m.b,n=cfg.cats.length,band=pw/n,bwid=Math.min(24,band*0.5);
  var svg=S('svg',{width:W,height:Hh,viewBox:'0 0 '+W+' '+Hh,role:'img','aria-label':cfg.aria||'Chart'},plot);
  var Yv=function(x){return m.t+ph-(x/cfg.yMax)*ph},y0=Yv(0);
  [0,20,40,60,80,100].forEach(function(t){S('line',{x1:m.l,x2:m.l+pw,y1:Yv(t),y2:Yv(t),'class':t===0?'axis':'grid'},svg);S('text',{x:m.l-8,y:Yv(t)+4,'text-anchor':'end','class':'tick'},svg,t)});
  cfg.cats.forEach(function(c,i){
    var cx=m.l+band*(i+.5),x=cx-bwid/2,val=v[i]*sc,y=Yv(val),r=Math.max(0,Math.min(4,(y0-y)/2)),yr=Yv(ref[i]);
    var p=S('path',{d:'M'+x+' '+y0+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+bwid-r)+'Q'+(x+bwid)+' '+y+' '+(x+bwid)+' '+(y+r)+'V'+y0+'Z','class':'hit',tabindex:0,role:'img','aria-label':'Aged '+c+', '+st.year+': '+v[i].toFixed(1)+' per 100 holders; 2019: '+ref[i].toFixed(1)},svg);
    p.style.fill='var(--s1)';
    S('line',{x1:cx-bwid/2-7,x2:cx+bwid/2+7,y1:yr,y2:yr,'class':'ref'},svg);
    var ly=(yr<=y+2&&y-yr<17)?yr-7:y-7;
    S('text',{x:cx,y:ly,'text-anchor':'middle','class':'val'},svg,String(Math.round(val)));
    S('text',{x:cx,y:Hh-9,'text-anchor':'middle','class':'tick'},svg,wide?c:cfg.catsShort[i]);
    hover(p,'Aged '+c+' · '+st.year,function(){return [{c:'--s1',name:'withdrawers per 100 holders',val:cfg.frames[st.year][i].toFixed(1)},{tick:true,name:'in '+cfg.ref,val:ref[i].toFixed(1)}]});
  });
}

/* ---------- tables ---------- */
function buildTable(tw,cfg,st){
  tw.textContent='';
  var t=H('table',null,tw),hd=H('tr',null,H('thead',null,t)),tb=H('tbody',null,t),f=cfg.tipFmt||cfg.fmt||cfg.yFmt;
  if(cfg.type==='line'){
    H('th',{scope:'col'},hd,cfg.xTitle);cfg.series.forEach(function(s){H('th',{scope:'col'},hd,s.name)});
    cfg.x.forEach(function(x,i){var tr=H('tr',null,tb);H('th',{scope:'row'},tr,x);cfg.series.forEach(function(s){H('td',null,tr,s.values[i]==null?'–':f(s.values[i]))})});
  }else if(cfg.type==='hstack'){
    var data=cfg.modes?cfg.modes[st.mode]:cfg.data;
    H('th',{scope:'col'},hd,cfg.rowTitle||'');cfg.segs.forEach(function(s){H('th',{scope:'col'},hd,s.name)});
    cfg.rows.forEach(function(r,i){var tr=H('tr',null,tb);H('th',{scope:'row'},tr,r.label+(r.sub?' ('+r.sub+')':''));data[i].forEach(function(v){H('td',null,tr,cfg.fmt(v))})});
  }else{
    H('th',{scope:'col'},hd,'Age');cfg.years.forEach(function(y){H('th',{scope:'col'},hd,y)});
    cfg.cats.forEach(function(c,i){var tr=H('tr',null,tb);H('th',{scope:'row'},tr,c);cfg.years.forEach(function(y){H('td',null,tr,cfg.frames[y][i].toFixed(1))})});
  }
}

/* ---------- mount ---------- */
var entered=[];
function mount(node){
  var cfg=CH[node.getAttribute('data-chart')];if(!cfg){node.textContent='Chart data missing';return}
  var fig=node.closest('.fig'),h=fig&&fig.querySelector('h3');cfg.aria=h?h.textContent:'Chart';
  var st={mode:cfg.toggle?cfg.toggle[0][0]:null,year:cfg.years?cfg.years[cfg.years.length-1]:null,timer:null,busy:false};
  var bar=H('div',{'class':'bar'},node),leg=H('div',{'class':'legend'},bar);
  function lg(cls,c,txt){var s=H('span',{'class':'lg'},leg),k=H('i',{'class':'k '+cls},s);if(c)k.style.background='var('+c+')';s.appendChild(document.createTextNode(txt))}
  if(cfg.type==='line'){cfg.series.forEach(function(s){lg('line',s.c,s.name)});if(cfg.bands)lg('bandk',null,cfg.bandLabel)}
  else if(cfg.type==='hstack'){if(!cfg.simple)cfg.segs.forEach(function(s){lg('sw',s.c,s.name)})}
  else{lg('sw','--s1','Selected year');lg('tick',null,cfg.ref+' level')}
  var tbtn=H('button',{'class':'btn',type:'button','aria-pressed':'false'},bar,'Show table');
  var ctl=null,yrEl,rg,regEl,playBtn,modeBtns=[];
  if(cfg.toggle){
    ctl=H('div',{'class':'ctl'},node);var sg=H('div',{'class':'seg',role:'group','aria-label':'Measure'},ctl);
    cfg.toggle.forEach(function(tg,i){var b=H('button',{'class':'btn',type:'button','aria-pressed':i===0?'true':'false'},sg,tg[1]);modeBtns.push(b);b.addEventListener('click',function(){setMode(tg[0])})});
  }
  if(cfg.type==='vbar'){
    ctl=H('div',{'class':'ctl'},node);
    playBtn=H('button',{'class':'btn',type:'button'},ctl,'Play 2012–2023');
    yrEl=H('span',{'class':'yr','aria-live':'polite'},ctl,st.year);
    rg=H('input',{type:'range',min:0,max:cfg.years.length-1,step:1,value:cfg.years.length-1,'aria-label':'Tax year',id:'yr-'+node.getAttribute('data-chart')},ctl);
    regEl=H('span',{'class':'regime'},ctl,cfg.regime[st.year]);
    rg.addEventListener('input',function(){stop();setYear(+rg.value,true)});
    playBtn.addEventListener('click',function(){if(st.timer)stop();else play()});
  }
  var plot=H('div',{'class':'plot'},node),tw=H('div',{'class':'tbl-wrap'},node);tw.hidden=true;
  function width(){return Math.max(260,Math.floor(plot.clientWidth))}
  function draw(M,scale){if(plot.hidden)return;var W=width();if(cfg.type==='line')renderLine(plot,cfg,W);else if(cfg.type==='hstack')renderH(plot,cfg,W,st,M,scale);else renderV(plot,cfg,W,st,M,scale)}
  function setMode(mo){
    if(mo===st.mode||st.busy)return;var A=cfg.modes[st.mode],B=cfg.modes[mo];st.mode=mo;
    modeBtns.forEach(function(b,i){b.setAttribute('aria-pressed',cfg.toggle[i][0]===mo?'true':'false')});
    if(!tw.hidden){buildTable(tw,cfg,st);return}
    st.busy=true;tween(520,function(e){draw(A.map(function(row,ri){return row.map(function(a,si){return a+(B[ri][si]-a)*e})}))},function(){st.busy=false;draw()});
  }
  function setYear(idx,anim){
    var y=cfg.years[idx],from=st.cur||cfg.frames[st.year],to=cfg.frames[y];st.year=y;yrEl.textContent=y;rg.value=idx;regEl.textContent=cfg.regime[y];
    if(anim&&!RM&&!plot.hidden)tween(360,function(e){st.cur=from.map(function(f,i){return f+(to[i]-f)*e});draw(st.cur)},function(){st.cur=null;draw()});
    else{st.cur=null;draw()}
  }
  function stop(){if(st.timer){clearInterval(st.timer);st.timer=null}if(playBtn)playBtn.textContent='Play 2012–2023'}
  function play(){
    var i=0;setYear(0,false);playBtn.textContent='Pause';
    st.timer=setInterval(function(){i++;if(i>=cfg.years.length){stop();return}setYear(i,true);if(i===cfg.years.length-1)stop()},RM?1100:820);
  }
  tbtn.addEventListener('click',function(){
    var show=tw.hidden;if(show){stop();buildTable(tw,cfg,st)}
    tw.hidden=!show;plot.hidden=show;tbtn.setAttribute('aria-pressed',show?'true':'false');tbtn.textContent=show?'Show chart':'Show table';
    if(!show)draw();
  });
  draw();
  var lastW=width(),rt=null;
  if('ResizeObserver' in window)new ResizeObserver(function(){if(plot.hidden)return;var w=width();if(w===lastW)return;lastW=w;clearTimeout(rt);rt=setTimeout(function(){draw(st.cur)},90)}).observe(plot);
  entered.push({fig:fig,enter:function(){
    if(RM||plot.hidden)return;
    if(cfg.type==='hstack')tween(750,function(e){draw(null,e)},function(){draw()});
    else if(cfg.type==='vbar')play();
  }});
}
Array.prototype.forEach.call(document.querySelectorAll('.chart[data-chart]'),mount);

/* ---------- entrance: once per figure, from a complete resting state ---------- */
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;io.unobserve(e.target);var fig=e.target;fig.classList.add('in');
    entered.forEach(function(c){if(c.fig===fig)c.enter()});
    setTimeout(function(){fig.classList.remove('in')},1800);
  })},{threshold:.35});
  Array.prototype.forEach.call(document.querySelectorAll('figure.fig'),function(f){if(f.querySelector('.chart'))io.observe(f)});
}

/* ---------- references ---------- */
var order=[],num={},ol=document.getElementById('reflist');
Array.prototype.forEach.call(document.querySelectorAll('sup.r'),function(sup){
  var keys=sup.getAttribute('data-r').split(/\s+/),first=true;
  keys.forEach(function(k){
    if(!REFS[k]){sup.appendChild(document.createTextNode('[?'+k+']'));sup.className+=' bad';return}
    if(!num[k]){order.push(k);num[k]=order.length}
    if(!first)sup.appendChild(document.createTextNode(','));first=false;
    H('a',{href:'#ref-'+num[k],title:REFS[k][0]+'. '+REFS[k][1]},sup,String(num[k]));
  });
});
if(ol)order.forEach(function(k){var r=REFS[k],li=H('li',{id:'ref-'+num[k]},ol);li.appendChild(document.createTextNode(r[0]+'. '+r[1]+' '));H('a',{href:r[2],target:'_blank',rel:'noopener'},li,r[2].replace(/^https?:\/\/(www\.)?/,'').split('/')[0])});

/* ---------- contents rail ---------- */
var links={};Array.prototype.forEach.call(document.querySelectorAll('.toc a'),function(a){links[a.getAttribute('href').slice(1)]=a});
if('IntersectionObserver' in window){
  var so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){for(var k in links)links[k].classList.remove('on');if(links[e.target.id])links[e.target.id].classList.add('on')}})},{rootMargin:'-12% 0px -78% 0px'});
  Array.prototype.forEach.call(document.querySelectorAll('.prose section[id]'),function(s){so.observe(s)});
}
})();
</script>
