<title>Retirement Account Withdrawal Trends</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one serif reading column beside a sticky contents rail; figures sit on pale panels a little wider than the text;
   headline numbers are set as numbered boxes, the way an information return lays out its fields. */
:root{
  --bg:#f6f7f9; --surface:#fdfdfe; --ink:#12161c; --ink-2:#444b55; --muted:#6b7380; --rule:#d9dde3; --rule-strong:#12161c;
  --accent:#a8261b; --link:#1c4f9c;
  --grid:#e6e9ee; --axis:#b4bbc5; --band:#e7eaf0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --other:#b4bbc5;
  --s1-ink:#ffffff; --s2-ink:#12161c; --s3-ink:#12161c; --s4-ink:#12161c; --other-ink:#12161c;
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#1c5cab; --o5:#0d366b;
  --o1-ink:#12161c; --o2-ink:#12161c; --o3-ink:#ffffff; --o4-ink:#ffffff; --o5-ink:#ffffff;
  --tip-bg:#12161c; --tip-fg:#fdfdfe; --tip-mut:#b4bbc5;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1114; --surface:#171a1f; --ink:#f2f4f7; --ink-2:#c2c8d1; --muted:#8e96a3; --rule:#2b3038; --rule-strong:#f2f4f7;
    --accent:#ff9086; --link:#8ab4f8;
    --grid:#262b33; --axis:#414853; --band:#20252d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --other:#4a515c;
    --s1-ink:#0b0d10; --s2-ink:#0b0d10; --s3-ink:#0b0d10; --s4-ink:#0b0d10; --other-ink:#f2f4f7;
    --o1:#184f95; --o2:#2a78d6; --o3:#5598e7; --o4:#86b6ef; --o5:#b7d3f6;
    --o1-ink:#ffffff; --o2-ink:#ffffff; --o3-ink:#0b0d10; --o4-ink:#0b0d10; --o5-ink:#0b0d10;
    --tip-bg:#f2f4f7; --tip-fg:#12161c; --tip-mut:#5a6270;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1114; --surface:#171a1f; --ink:#f2f4f7; --ink-2:#c2c8d1; --muted:#8e96a3; --rule:#2b3038; --rule-strong:#f2f4f7;
  --accent:#ff9086; --link:#8ab4f8;
  --grid:#262b33; --axis:#414853; --band:#20252d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --other:#4a515c;
  --s1-ink:#0b0d10; --s2-ink:#0b0d10; --s3-ink:#0b0d10; --s4-ink:#0b0d10; --other-ink:#f2f4f7;
  --o1:#184f95; --o2:#2a78d6; --o3:#5598e7; --o4:#86b6ef; --o5:#b7d3f6;
  --o1-ink:#ffffff; --o2-ink:#ffffff; --o3-ink:#0b0d10; --o4-ink:#0b0d10; --o5-ink:#0b0d10;
  --tip-bg:#f2f4f7; --tip-fg:#12161c; --tip-mut:#5a6270;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--link);text-underline-offset:.16em;text-decoration-thickness:.06em}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,44px);padding-block:clamp(22px,4vw,44px) 80px}

/* masthead */
.eyebrow{font:500 .74rem/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 .9rem}
h1{font:800 clamp(2rem,5.2vw,3.3rem)/1.04 var(--sans);letter-spacing:-.022em;margin:0;max-width:17ch;text-wrap:balance}
.deck{font-size:clamp(1.08rem,1.7vw,1.26rem);line-height:1.5;color:var(--ink-2);max-width:58ch;margin:1.1rem 0 0}
.meta{font:400 .8rem/1.5 var(--sans);color:var(--muted);margin:1rem 0 0}

/* key figures: numbered boxes */
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-strong);border:1.5px solid var(--rule-strong);margin:clamp(22px,3.4vw,36px) 0 0}
.box{background:var(--surface);padding:10px 14px 15px;min-width:0;display:flex;flex-direction:column}
.box .lbl{font:600 .74rem/1.3 var(--sans);display:flex;gap:.55em;align-items:baseline;min-height:2.6em}
.box .no{font:500 .74rem/1.3 var(--mono);color:var(--accent);flex:none}
.box .val{font:700 clamp(1.7rem,3.2vw,2.3rem)/1.05 var(--sans);letter-spacing:-.02em;margin-top:.55rem}
.box .val small{font:600 .46em/1 var(--sans);letter-spacing:0;color:var(--ink-2);margin:0 .15em}
.box .bn{font:400 .8rem/1.4 var(--sans);color:var(--ink-2);margin-top:.5rem}
@media (max-width:860px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.form{grid-template-columns:minmax(0,1fr)}.box .lbl{min-height:0}}

/* page layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-top:clamp(26px,4vw,48px)}
.toc{font:400 .86rem/1.35 var(--sans);border-top:2px solid var(--rule-strong);padding-top:.7rem;margin-bottom:1.6rem}
.toc h2{font:500 .72rem/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
.toc ol{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
.toc li{break-inside:avoid;padding:.16rem 0}
.toc a{color:var(--ink-2);text-decoration:none;display:flex;gap:.6em}
.toc a:hover{color:var(--ink);text-decoration:underline}
.toc a .n{font-family:var(--mono);font-size:.76rem;color:var(--muted);min-width:1.4em}
.toc a.on{color:var(--ink);font-weight:700}
.toc a.on .n{color:var(--accent)}
@media (min-width:1080px){
  .layout{grid-template-columns:200px minmax(0,1fr);gap:64px}
  .toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 22px);align-self:start;margin-bottom:0}
  .toc ol{columns:1}
}
@media (max-width:520px){.toc ol{columns:1}}

/* prose */
.prose{min-width:0}
.prose section{padding-top:.4rem;margin-bottom:clamp(2.2rem,4vw,3.4rem);scroll-margin-top:18px}
.prose h2{font:800 clamp(1.42rem,2.5vw,1.8rem)/1.15 var(--sans);letter-spacing:-.012em;margin:0 0 1rem;padding-top:.85rem;border-top:2px solid var(--rule-strong);text-wrap:balance;display:flex;gap:.6em;align-items:baseline}
.prose h2 .n{font:500 .8rem/1 var(--mono);color:var(--accent);letter-spacing:.04em;flex:none}
.prose h3.sub{font:700 1.08rem/1.3 var(--sans);margin:1.9rem 0 .5rem;max-width:68ch}
.prose p,.prose ul,.prose ol{max-width:68ch;margin:0 0 1rem}
.prose ul,.prose ol{padding-left:1.2rem}
.prose li{margin-bottom:.55rem}
.prose li::marker{color:var(--muted)}
.prose strong{font-weight:600}
.lead{font-size:1.16rem;line-height:1.55}
.findings{list-style:none;padding:0 !important;counter-reset:f}
.findings li{counter-increment:f;display:grid;grid-template-columns:2.1rem minmax(0,1fr);margin-bottom:.9rem}
.findings li::before{content:counter(f);font:500 .8rem/1.9 var(--mono);color:var(--accent)}
sup.r{font:500 .68rem/1 var(--sans);vertical-align:super;margin-left:.1em;white-space:nowrap}
sup.r a{text-decoration:none;padding:0 .08em}
sup.r a:hover{text-decoration:underline}

/* notes */
.note{font:400 .9rem/1.5 var(--sans);color:var(--ink-2);border:1px solid var(--rule);background:var(--surface);padding:.75rem .95rem;max-width:68ch;margin:0 0 1.2rem}
.note b{font:500 .7rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-right:.6em}

/* tables */
.tbl-wrap{overflow-x:auto;max-width:880px;margin:0 0 1.3rem}
table{border-collapse:collapse;width:100%;font:400 .86rem/1.4 var(--sans);font-variant-numeric:tabular-nums}
caption{caption-side:top;text-align:left;font:700 .95rem/1.35 var(--sans);padding:0 0 .5rem;color:var(--ink)}
caption small{display:block;font:400 .82rem/1.4 var(--sans);color:var(--ink-2);margin-top:.15rem}
th,td{text-align:left;vertical-align:top;padding:.48rem .7rem .48rem 0;border-bottom:1px solid var(--rule)}
thead th{font-weight:700;border-bottom:1.5px solid var(--rule-strong);white-space:nowrap}
tbody th{font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
table.def td,table.def th{min-width:9.5rem}
table.def thead th{white-space:normal}

/* figures */
figure.fig{margin:1.7rem 0 1.9rem;max-width:880px;background:var(--surface);border:1px solid var(--rule);border-top:2px solid var(--rule-strong);padding:14px clamp(12px,2.2vw,20px) 13px}
.fig-no{font:500 .7rem/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
.fig h3{font:700 1.08rem/1.3 var(--sans);margin:.25rem 0 .2rem;text-wrap:balance;max-width:62ch}
.fig .fig-sub{font:400 .86rem/1.42 var(--sans);color:var(--ink-2);margin:0 0 .7rem;max-width:78ch}
.fig-src,.fig .fig-src{font:400 .78rem/1.5 var(--sans);color:var(--muted);margin:.7rem 0 0;max-width:none}
.prose p.fig-src.t{max-width:880px;margin:-.6rem 0 1.2rem}
.chart{min-width:0}
.chart .bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:.45rem}
.legend{display:flex;flex-wrap:wrap;gap:5px 16px;font:400 .8rem/1.35 var(--sans);color:var(--ink-2);min-width:0}
.lg{display:inline-flex;align-items:center;gap:.45em}
.k{display:inline-block;flex:none}
.k.line{width:18px;height:2px;border-radius:1px}
.k.sw{width:11px;height:11px;border-radius:2px}
.k.tick{width:16px;height:2px;background:var(--ink)}
.k.bandk{width:14px;height:11px;background:var(--band);border:1px solid var(--rule)}
.btn{font:600 .76rem/1 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--axis);border-radius:3px;padding:.42rem .6rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:3px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn + .btn{border-left:1px solid var(--axis)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:.2rem 0 .5rem;font:400 .82rem/1.3 var(--sans);color:var(--ink-2)}
.ctl .yr{font:700 1.55rem/1 var(--sans);color:var(--ink);min-width:3.3ch}
.ctl .regime{flex:1 1 12rem;min-width:0}
.ctl input[type=range]{flex:1 1 180px;min-width:120px;max-width:340px;accent-color:var(--s1)}
.plot{min-width:0;position:relative}
.plot svg{display:block;max-width:100%;overflow:visible}
.plot text{font-family:var(--sans);font-size:12px;fill:var(--ink-2)}
.plot text.tick{fill:var(--muted);font-variant-numeric:tabular-nums}
.plot text.lab{fill:var(--ink-2)}
.plot text.lab .v,.plot text.val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.plot text.rowl{fill:var(--ink);font-weight:600}
.plot text.rows{fill:var(--muted);font-size:11.5px}
.plot text.ann{fill:var(--ink-2);font-size:12px}
.plot text.in{font-weight:600;font-size:11.5px;pointer-events:none}
.plot .grid{stroke:var(--grid);stroke-width:1}
.plot .axis{stroke:var(--axis);stroke-width:1}
.plot .band{fill:var(--band)}
.plot .zone{fill:var(--band);opacity:.5}
.plot .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plot .dot,.plot .pt{stroke:var(--surface);stroke-width:2}
.plot .xh{stroke:var(--axis);stroke-width:1}
.plot .lead{stroke:var(--axis);stroke-width:1;fill:none}
.plot .ref{stroke:var(--ink);stroke-width:2}
.plot .hit{cursor:default}
.plot .hit:focus{outline:none}
.plot .hit:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.plot .hit:hover{filter:brightness(1.08)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font:400 .78rem/1.35 var(--sans);padding:.5rem .65rem;border-radius:4px;max-width:min(300px,86vw);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip .tt{color:var(--tip-mut);margin-bottom:.25rem}
.tip .tr{display:flex;align-items:center;gap:.5em}
.tip .tr b{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2ch}
.tip .tr .k.line{width:12px}
.chart .tbl-wrap{margin:0;max-width:none}
.chart table{font-size:.8rem}
.chart th,.chart td{padding:.32rem .7rem .32rem 0}
.chart td{text-align:right}
.chart tbody th{font-weight:600;white-space:nowrap}
.chart thead th{white-space:normal;text-align:right;vertical-align:bottom}
.chart thead th:first-child{text-align:left}

/* timeline */
.tl{list-style:none;margin:0;padding:0 !important;max-width:none !important;font-family:var(--sans)}
.tl li{display:grid;grid-template-columns:4.4rem 14px minmax(0,1fr);column-gap:12px;margin:0;position:relative;padding-bottom:.85rem}
.tl li::before{content:"";grid-column:2;grid-row:1;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);margin:.38rem 0 0 2px;z-index:1}
.tl li::after{content:"";position:absolute;left:calc(4.4rem + 12px + 6.5px);top:.9rem;bottom:-.4rem;width:1px;background:var(--axis)}
.tl li:last-child::after{display:none}
.tl li.w::before{background:var(--accent);border-color:var(--accent)}
.tl li.f::before{border-style:dashed}
.tl .y{grid-column:1;grid-row:1;font:500 .86rem/1.5 var(--mono);color:var(--ink);text-align:right}
.tl .e{grid-column:3;grid-row:1;font-size:.9rem;line-height:1.45;color:var(--ink-2)}
.tl .e b{color:var(--ink);font-weight:700}

/* references */
#reflist{font:400 .84rem/1.5 var(--sans);color:var(--ink-2);padding-left:2.1rem;max-width:880px}
#reflist li{margin-bottom:.45rem;overflow-wrap:anywhere;scroll-margin-top:18px}
#reflist li:target{background:var(--band)}
.foot{font:400 .8rem/1.5 var(--sans);color:var(--muted);border-top:1px solid var(--rule);margin-top:2.4rem;padding-top:1rem;max-width:880px}

/* motion: charts are complete at rest; these run once when a figure first scrolls into view */
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .fig.in .ln{animation:draw 1.15s cubic-bezier(.3,.6,.25,1) both}
  .fig.in .dot,.fig.in .pt,.fig.in text.lab,.fig.in .lead,.fig.in text.ann{animation:fade .5s ease .95s both}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@media print{
  :root{--bg:#fff;--surface:#fff}
  body{font-size:10.5pt}
  .wrap{max-width:none;padding:0}
  .layout{display:block}
  .toc,.btn,.seg,.ctl input,.ctl button,.tip{display:none !important}
  .prose section{break-inside:auto}
  .prose h2{break-after:avoid}
  figure.fig,.tbl-wrap,.note,.form{break-inside:avoid}
  #s-rules,#s-who,#s-cash,#s-roll,#s-survey,#s-notes{break-before:page}
  a{color:inherit}
  @page{margin:17mm 16mm}
}
</style>
